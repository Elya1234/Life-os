<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>LIFE-OS — Système de Gestion de Vie, Études & Entrepreneuriat</title>
<style>
  :root {
    --bg-app: #090d16;
    --bg-surface: #111827;
    --bg-surface-2: #182234;
    --bg-surface-3: #1f2b42;
    --bg-glass: rgba(17, 24, 39, 0.85);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --border-color: rgba(148, 163, 184, 0.14);
    --border-strong: rgba(148, 163, 184, 0.28);
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --accent-gold: #f59e0b;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #38bdf8;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --sidebar-w: 272px;
    --topbar-h: 64px;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  [data-theme="light"] {
    --bg-app: #f1f5f9;
    --bg-surface: #ffffff;
    --bg-surface-2: #f8fafc;
    --bg-surface-3: #e2e8f0;
    --bg-glass: rgba(255, 255, 255, 0.88);
    --text-main: #0f172a;
    --text-muted: #475569;
    --text-dim: #64748b;
    --border-color: rgba(15, 23, 42, 0.1);
    --border-strong: rgba(15, 23, 42, 0.22);
    --accent: #0284c7;
    --accent-2: #4f46e5;
    --accent-gold: #d97706;
    --success: #059669;
    --warning: #d97706;
    --danger: #dc2626;
    --info: #0284c7;
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: var(--font-sans); background: var(--bg-app); color: var(--text-main); line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  a { color: var(--accent); text-decoration: none; }
  code, pre, .mono { font-family: var(--font-mono); }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.45); }

  /* Layout */
  .app-shell { display: flex; min-height: 100vh; width: 100%; }
  .sidebar {
    width: var(--sidebar-w);
    background: var(--bg-surface);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 40;
    transition: transform 0.25s ease;
  }
  .sidebar-header {
    height: var(--topbar-h);
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-color);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; letter-spacing: 0.4px; }
  .brand-badge {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 0.9rem;
  }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
  .nav-group-label {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-dim); padding: 14px 10px 6px;
  }
  .nav-item {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--radius-sm); font-size: 0.86rem;
    color: var(--text-muted); text-align: left; transition: all 0.15s ease; margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--bg-surface-2); color: var(--text-main); }
  .nav-item.active {
    background: rgba(56, 189, 248, 0.14); color: var(--accent); font-weight: 600;
  }
  .nav-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.65; flex-shrink: 0; }

  .main-wrapper { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-width: 0; }

  /* Topbar & Persistent Timer Bar */
  .topbar {
    height: var(--topbar-h);
    background: var(--bg-glass);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-color);
    padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .menu-toggle {
    display: none; width: 38px; height: 38px; border-radius: var(--radius-sm);
    align-items: center; justify-content: center; background: var(--bg-surface-2);
    border: 1px solid var(--border-color); font-size: 1.1rem;
  }
  .page-title-wrap h1 { font-size: 1.08rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-title-wrap span { font-size: 0.75rem; color: var(--text-muted); }

  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .search-box {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-surface-2); border: 1px solid var(--border-color);
    border-radius: 99px; padding: 5px 12px; font-size: 0.82rem;
  }
  .search-box input { background: transparent; border: none; outline: none; width: 170px; font-size: 0.82rem; }
  .search-box input:focus { width: 220px; }

  /* Persistent Global Timer Pill */
  .global-timer-bar {
    background: var(--bg-surface-2);
    border-bottom: 1px solid var(--border-color);
    padding: 7px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 0.82rem;
  }
  .timer-readout { font-family: var(--font-mono); font-weight: 700; font-size: 0.96rem; color: var(--accent); }
  .timer-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* Content */
  .content-area { padding: 22px; max-width: 1560px; width: 100%; margin: 0 auto; flex: 1; }

  /* Cards, Buttons, Badges, Inputs */
  .card {
    background: var(--bg-surface); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow);
  }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-title { font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .card-sub { font-size: 0.78rem; color: var(--text-muted); }

  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

  .kpi-val { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0; }
  .kpi-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  .kpi-meta { font-size: 0.76rem; color: var(--text-dim); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 13px; border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 600;
    border: 1px solid var(--border-color); background: var(--bg-surface-2); color: var(--text-main);
    transition: all 0.15s ease; min-height: 34px;
  }
  .btn:hover { border-color: var(--border-strong); background: var(--bg-surface-3); }
  .btn-primary { background: var(--accent); color: #06121f; border-color: transparent; }
  .btn-primary:hover { opacity: 0.92; background: var(--accent); }
  .btn-success { background: var(--success); color: #04160f; border-color: transparent; }
  .btn-warning { background: var(--warning); color: #1a1102; border-color: transparent; }
  .btn-danger { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border-color: rgba(239, 68, 68, 0.35); }
  [data-theme="light"] .btn-danger { color: #b91c1c; }
  .btn-sm { padding: 4px 9px; font-size: 0.76rem; min-height: 28px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
    border-radius: 99px; font-size: 0.72rem; font-weight: 600;
    background: var(--bg-surface-2); color: var(--text-muted); border: 1px solid var(--border-color);
  }
  .badge-p1 { background: rgba(239, 68, 68, 0.16); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
  .badge-p2 { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }
  .badge-p3 { background: rgba(56, 189, 248, 0.16); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }
  .badge-ok { background: rgba(16, 185, 129, 0.16); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
  .badge-demo { background: rgba(129, 140, 248, 0.18); color: #a5b4fc; border-color: rgba(129, 140, 248, 0.35); }

  input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="email"], select, textarea {
    width: 100%; background: var(--bg-surface-2); border: 1px solid var(--border-color);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 0.84rem; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 76px; resize: vertical; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--border-color); text-align: left; vertical-align: top; }
  th { font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); background: var(--bg-surface-2); }

  .progress-bar { width: 100%; height: 8px; background: var(--bg-surface-3); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); transition: width 0.25s ease; }

  /* Kanban */
  .kanban-board { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 14px; overflow-x: auto; }
  .kanban-col { background: var(--bg-surface-2); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; }
  .kanban-col-title { font-weight: 700; font-size: 0.84rem; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .kanban-item { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 8px; }

  /* Timeline / Schedule */
  .slot-row {
    display: grid; grid-template-columns: 112px 1fr auto; gap: 12px; align-items: center;
    padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);
    background: var(--bg-surface-2); margin-bottom: 7px; font-size: 0.83rem;
  }
  .slot-time { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700; color: var(--accent); }
  .slot-fixed { border-left: 4px solid var(--accent-2); }
  .slot-gap { border-left: 4px dashed var(--warning); background: rgba(245, 158, 11, 0.08); }
  .slot-done { opacity: 0.75; }

  /* Modal & Toast */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
    max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px; box-shadow: var(--shadow);
  }
  .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 120; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
  .toast {
    background: var(--bg-surface-3); border: 1px solid var(--border-strong); border-left: 4px solid var(--accent);
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.82rem; box-shadow: var(--shadow);
  }

  /* Focus Mode Overlay */
  .focus-overlay {
    position: fixed; inset: 0; background: var(--bg-app); z-index: 90;
    display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;
  }
  .focus-overlay.active { display: flex; }
  .focus-clock { font-family: var(--font-mono); font-size: clamp(3rem, 10vw, 6rem); font-weight: 800; color: var(--accent); margin: 16px 0; }

  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 35; }

  @media (max-width: 1024px) {
    .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .main-wrapper { margin-left: 0; }
    .menu-toggle { display: inline-flex; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .search-box input { width: 110px; }
    .search-box input:focus { width: 140px; }
    .content-area { padding: 14px; }
  }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="NavigationManager.closeMobileMenu()"></div>

<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-badge">L</div>
        <div>
          <div>LIFE-OS</div>
          <div style="font-size:0.66rem;font-weight:500;color:var(--text-muted)">v1.0 • Hors ligne</div>
        </div>
      </div>
      <button class="btn btn-sm" onclick="NavigationManager.closeMobileMenu()" title="Fermer">✕</button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- MAIN -->
  <div class="main-wrapper">
    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="NavigationManager.toggleMobileMenu()" aria-label="Menu">☰</button>
        <div class="page-title-wrap">
          <h1 id="pageTitle">Dashboard</h1>
          <span id="pageSubtitle">Centre de commande personnel</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="globalSearchInput" placeholder="Recherche globale..." oninput="NavigationManager.handleGlobalSearch(this.value)">
        </div>
        <button class="btn btn-sm" onclick="FocusManager.enterFocusMode()" title="Mode Concentration">🎯 Focus</button>
        <button class="btn btn-sm" onclick="SettingsManager.toggleTheme()" title="Clair / Sombre">🌓</button>
        <button class="btn btn-sm btn-primary" onclick="BackupManager.quickManualBackup()" title="Sauvegarde locale">💾 Sauver</button>
      </div>
    </header>

    <!-- PERSISTENT GLOBAL TIMER BAR -->
    <div class="global-timer-bar" id="globalTimerBar">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="badge badge-ok" id="timerStatusBadge">Prêt</span>
        <span class="timer-readout" id="globalTimerDisplay">00:00:00</span>
        <select id="timerModeSelect" style="width:auto;padding:4px 8px;font-size:0.78rem;" onchange="TimerManager.setMode(this.value)">
          <option value="stopwatch">Chronomètre</option>
          <option value="countdown">Compte à rebours</option>
          <option value="pomodoro">Pomodoro (25m)</option>
        </select>
        <input type="number" id="timerDurationMin" value="25" min="1" max="300" style="width:66px;padding:4px 6px;font-size:0.78rem;" title="Durée (min)">
        <select id="timerCategorySelect" style="width:auto;padding:4px 8px;font-size:0.78rem;">
          <option value="BTS Opticien-Lunetier">BTS Opticien-Lunetier</option>
          <option value="Rapport de stage">Rapport de stage</option>
          <option value="ORPAZ-STYLE">ORPAZ-STYLE</option>
          <option value="Code de la route">Code de la route</option>
          <option value="Sofer Stam">Sofer Stam</option>
          <option value="Examen civique">Examen civique</option>
          <option value="Lecture">Lecture (Rav Arush)</option>
          <option value="Sport">Sport</option>
          <option value="Autre activité">Autre activité</option>
        </select>
        <input type="text" id="timerNoteInput" placeholder="Note / tâche / matière..." style="width:160px;padding:4px 8px;font-size:0.78rem;">
      </div>
      <div class="timer-controls">
        <button class="btn btn-sm btn-success" id="btnTimerStart" onclick="TimerManager.start()">▶ Démarrer</button>
        <button class="btn btn-sm btn-warning" onclick="TimerManager.pause()">⏸ Pause</button>
        <button class="btn btn-sm btn-primary" onclick="TimerManager.resume()">⏯ Reprendre</button>
        <button class="btn btn-sm" onclick="TimerManager.stopAndSave()">⏹ Terminer & Enregistrer</button>
        <button class="btn btn-sm btn-danger" onclick="TimerManager.reset()">↺ Réinit.</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="content-area" id="appContent"></main>
  </div>
</div>

<!-- FOCUS MODE OVERLAY -->
<div class="focus-overlay" id="focusOverlay">
  <span class="badge badge-p3">MODE CONCENTRATION ACTIF</span>
  <h2 id="focusTaskLabel" style="font-size:1.5rem;margin-top:12px;">Session de concentration</h2>
  <p id="focusGoalLabel" style="color:var(--text-muted);max-width:520px;margin-top:6px;"></p>
  <div class="focus-clock" id="focusOverlayClock">25:00</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
    <button class="btn btn-success" onclick="TimerManager.start()">▶ Démarrer</button>
    <button class="btn btn-warning" onclick="TimerManager.pause()">⏸ Pause</button>
    <button class="btn btn-primary" onclick="FocusManager.openPostSessionModal()">✓ Clôturer session</button>
    <button class="btn" onclick="FocusManager.exitFocusMode()">Quitter le mode Focus</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)UI.closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toastContainer"></div>

<script>
/* ============================================================================
   LIFE-OS ARCHITECTURE MODULES
   - DatabaseManager (IndexedDB + Schema Version & Migrations)
   - SettingsManager (LocalStorage + Fixed Schedule + Shabbat/Holidays + Energy)
   - NavigationManager (24 views + Global Search + Responsive Menu)
   - DashboardManager (Live Clock, KPIs, Zero Unexplained Time, Progress)
   - PlanningEngine (Full waking-day engine, fixed slots, smart evening rotation, gaps)
   - TaskManager (Tasks, Subtasks, Recurrence, Statuses, List / Kanban / Calendar)
   - CalendarManager (Day / Week / Month / Chronological + Shabbat/Unavailability)
   - StudyManager (BTS subjects, weighted grades, spaced repetition, Rapport de stage,
                   Code/Permis B, Sofer Stam, Examen civique, Rav Arush)
   - CRMManager (Strict separation: Personal CRM vs ORPAZ-STYLE CRM + voluntary link)
   - ProjectManager (Projects, Milestones, Objectives across all horizons, Docs/Notes)
   - TimerManager (Timestamp-based persistent timer across navigation/reload/background)
   - FocusManager (Pomodoro/25/45/60/90/custom, pre/post session, focus mode, reminders)
   - BackupManager (Full/Selective JSON export, validate, dedup, preview, auto/manual, history)
   - StatisticsManager (SVG charts, real measured time vs habits, daily/weekly recap)
   - NotificationManager (In-app reminders, hydration/movement/break prompts, browser notif if granted)
   ============================================================================ */

const SCHEMA_VERSION = 1;
const DB_NAME = 'LifeOS_DB_v1';

const FIXED_SCHEDULE_DEFAULT = [
  { id: 'fix-1', start: '07:00', end: '08:00', label: 'Réveil, toilettes, hygiène, petit-déjeuner, préparation', category: 'Hygiène', protected: true },
  { id: 'fix-2', start: '08:00', end: '08:30', label: 'Trajet vers l’office', category: 'Déplacement', protected: true },
  { id: 'fix-3', start: '08:30', end: '12:30', label: 'Daf Hayomi à l’office', category: 'Prière et Torah', protected: true },
  { id: 'fix-4', start: '12:30', end: '13:00', label: 'Trajet retour', category: 'Déplacement', protected: true },
  { id: 'fix-5', start: '18:30', end: '20:30', label: 'Cours de Torah et Arvit', category: 'Prière et Torah', protected: true },
  { id: 'fix-6', start: '23:15', end: '23:30', label: 'Préparation au sommeil', category: 'Préparation personnelle', protected: true },
  { id: 'fix-7', start: '23:30', end: '23:59', label: 'Coucher (sommeil protégé)', category: 'Récupération', protected: true }
];

const CATEGORIES_ALL = [
  'Études', 'Travail', 'Entreprise', 'Prière et Torah', 'Déplacement',
  'Repas', 'Sport', 'Douche', 'Hygiène', 'Préparation personnelle',
  'Pause', 'Récupération', 'Lecture', 'Temps personnel', 'Organisation du lendemain'
];

const BTS_SUBJECTS_DEFAULT = [
  { name: 'Analyse de la vision', coeff: 4, difficulty: 'Élevée', progress: 0, grades: [], weakPoints: '', skills: '', nextReview: '' },
  { name: 'Optique géométrique', coeff: 4, difficulty: 'Élevée', progress: 0, grades: [], weakPoints: '', skills: '', nextReview: '' },

    el.textContent = msg;

    UI.openModal(`
      <h3 style="font-size:1.05rem;font-weight:700;margin-bottom:8px;">${esc(title)}</h3>

  todayStr() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  },
  nowTimeStr() {
    const d = new Date();
    return d.toTimeString().slice(0, 5);
  },
  timeToMin(t) {
    if (!t || !t.includes(':')) return 0;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  },
  minToTime(m) {
    const clamped = Math.max(0, Math.min(1439, Math.round(m)));
    const hh = String(Math.floor(clamped / 60)).padStart(2, '0');
    const mm = String(clamped % 60).padStart(2, '0');
    return `${hh}:${mm}`;
  },
  formatDurationSec(sec) {
    const s = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    return [h, m, r].map(v => String(v).padStart(2, '0')).join(':');
  },
  formatHoursFromSec(sec) {
    return ((sec || 0) / 3600).toFixed(1) + ' h';
  },
  uid(prefix = 'id') {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
  }
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ============================================================================
   1. DatabaseManager (IndexedDB + Schema Version & Migrations)
   ============================================================================ */
const DatabaseManager = {
  db: null,
  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, SCHEMA_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        const oldVersion = e.oldVersion;
        STORES.forEach(storeName => {
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: 'id' });
          }
        });
        this.runMigrations(db, e.target.transaction, oldVersion, SCHEMA_VERSION);
      };
      req.onsuccess = (e) => {
        this.db = e.target.result;
        resolve(this.db);
      };
      req.onerror = (e) => reject(e.target.error);
    });
  },
  runMigrations(db, tx, fromV, toV) {
    // Hook for deterministic schema migrations across versions
    if (fromV > 0 && fromV < toV) {
      console.info(`LIFE-OS migration du schéma v${fromV} vers v${toV}`);
    }
  },
  async getAll(storeName) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },
  async put(storeName, item) {
    if (!item.id) item.id = UI.uid(storeName);
    item.updatedAt = new Date().toISOString();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).put(item);
      req.onsuccess = () => resolve(item);
      req.onerror = () => reject(req.error);
    });
  },
  async remove(storeName, id) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).delete(id);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },
  async clearStore(storeName) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).clear();
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  },

/* ============================================================================
   4. TimerManager (Real Timestamp-Based Persistent Timer)
   ============================================================================ */
const TIMER_STATE_KEY = 'LifeOS_Timer_v1';
const TimerManager = {
  state: {
    mode: 'stopwatch', // 'stopwatch' | 'countdown' | 'pomodoro'
    status: 'idle',    // 'idle' | 'running' | 'paused'
    startedAtMs: null,
    accumulatedSec: 0,
    targetSec: 25 * 60,
    category: 'BTS Opticien-Lunetier',
    note: ''
  },
  intervalId: null,
  load() {
    try {
      const raw = localStorage.getItem(TIMER_STATE_KEY);
      if (raw) this.state = { ...this.state, ...JSON.parse(raw) };
    } catch (e) {}
    const modeSel = document.getElementById('timerModeSelect');
    const durInp = document.getElementById('timerDurationMin');
    const catSel = document.getElementById('timerCategorySelect');
    const noteInp = document.getElementById('timerNoteInput');
    if (modeSel) modeSel.value = this.state.mode;
    if (durInp) durInp.value = Math.max(1, Math.round(this.state.targetSec / 60));
    if (catSel) catSel.value = this.state.category;
    if (noteInp) noteInp.value = this.state.note || '';
    this.syncUI();
    if (!this.intervalId) {
      this.intervalId = setInterval(() => this.syncUI(), 500);
    }
  },
  save() {
    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(this.state));
  },
  setMode(mode) {
    this.state.mode = mode;
    const durInp = document.getElementById('timerDurationMin');
    if (mode === 'pomodoro') {
      this.state.targetSec = 25 * 60;
      if (durInp) durInp.value = 25;
    } else if (mode === 'countdown' && durInp) {
      this.state.targetSec = Math.max(60, Number(durInp.value || 25) * 60);
    }
    this.save();
    this.syncUI();
  },
  getElapsedSec() {
    let elapsed = this.state.accumulatedSec || 0;
    if (this.state.status === 'running' && this.state.startedAtMs) {
      elapsed += Math.floor((Date.now() - this.state.startedAtMs) / 1000);
    }
    return Math.max(0, elapsed);
  },
  getDisplaySec() {
    const elapsed = this.getElapsedSec();
    if (this.state.mode === 'stopwatch') return elapsed;
    return Math.max(0, (this.state.targetSec || 1500) - elapsed);
  },
  start() {
    const durInp = document.getElementById('timerDurationMin');
    const catSel = document.getElementById('timerCategorySelect');
    const noteInp = document.getElementById('timerNoteInput');
    if (durInp) this.state.targetSec = Math.max(60, Number(durInp.value || 25) * 60);
    if (catSel) this.state.category = catSel.value;
    if (noteInp) this.state.note = noteInp.value.trim();

    if (this.state.status !== 'running') {
      this.state.startedAtMs = Date.now();
      this.state.status = 'running';
      this.save();
      this.syncUI();
      UI.toast(`Minuteur démarré (${this.state.category})`);
    }
  },
  pause() {
    if (this.state.status === 'running') {
      this.state.accumulatedSec = this.getElapsedSec();
      this.state.startedAtMs = null;
      this.state.status = 'paused';
      this.save();
      this.syncUI();
      UI.toast('Minuteur en pause');
    }
  },
  resume() {
    if (this.state.status === 'paused') {
      this.state.startedAtMs = Date.now();
      this.state.status = 'running';
      this.save();
      this.syncUI();
      UI.toast('Minuteur repris');
    }
  },
  async stopAndSave() {
    const sec = this.getElapsedSec();
    const noteInp = document.getElementById('timerNoteInput');
    const catSel = document.getElementById('timerCategorySelect');
    const category = catSel ? catSel.value : this.state.category;
    const note = noteInp ? noteInp.value.trim() : this.state.note;

    this.reset(true);
    if (sec < 5) {
      UI.toast('Durée trop courte (< 5s) pour créer un log de temps.', 'warning');
      return;
    }
    const now = new Date();
    const log = {
      id: UI.uid('log'),
      date: UI.todayStr(),
      startTime: new Date(now.getTime() - sec * 1000).toTimeString().slice(0, 5),
      endTime: now.toTimeString().slice(0, 5),
      durationSec: sec,
      category,
      note
    };
    await DatabaseManager.put('timeLogs', log);
    UI.toast(`Temps enregistré : ${UI.formatDurationSec(sec)} (${category})`, 'success');
    NavigationManager.render();
  },
  reset(silent = false) {
    this.state.status = 'idle';
    this.state.startedAtMs = null;
    this.state.accumulatedSec = 0;
    this.save();
    this.syncUI();
    if (!silent) UI.toast('Minuteur réinitialisé');
  },
  syncUI() {
    const disp = document.getElementById('globalTimerDisplay');
    const badge = document.getElementById('timerStatusBadge');
    const focusClock = document.getElementById('focusOverlayClock');
    const showSec = this.getDisplaySec();
    if (disp) disp.textContent = UI.formatDurationSec(showSec);
    if (focusClock) focusClock.textContent = UI.formatDurationSec(showSec);
    if (badge) {
      badge.textContent = this.state.status === 'running' ? 'En cours' : (this.state.status === 'paused' ? 'En pause' : 'Prêt');
      badge.className = 'badge ' + (this.state.status === 'running' ? 'badge-p1' : (this.state.status === 'paused' ? 'badge-p2' : 'badge-ok'));
    }
    if (this.state.mode !== 'stopwatch' && this.state.status === 'running' && showSec === 0) {
      this.pause();
      UI.toast('Compte à rebours terminé ! Pensez à faire une pause.', 'success');
    }
  }
};

/* ============================================================================
   6. PlanningEngine & Zero Unexplained Time
   ============================================================================ */
const PlanningEngine = {
  async isDateUnavailable(dateStr) {
    const blackouts = await DatabaseManager.getAll('blackoutDates');
    const d = new Date(dateStr + 'T12:00:00');
    const isSat = d.getDay() === 6 && SettingsManager.data.shabbatRules.blockSaturday;
    const matched = blackouts.filter(b => dateStr >= b.startDate && dateStr <= b.endDate);
    return { blocked: isSat || matched.length > 0, isSaturday: isSat, reasons: matched };
  },

  async buildDayPlan(dateStr) {
    const unavail = await this.isDateUnavailable(dateStr);
    const allTasks = await DatabaseManager.getAll('tasks');
    const events = (await DatabaseManager.getAll('events')).filter(e => e.date === dateStr);
    const energy = SettingsManager.data.energyLevel || 'Moyen';

    // Never reschedule completed or cancelled tasks
    const openTasks = allTasks.filter(t =>
      !['Terminé', 'Annulé'].includes(t.status) &&
      (!t.dueDate || t.dueDate <= dateStr)
    );

    // Priority rank: P1 (BTS) > P1-Bis (Rapport) > P2 (Permis B / Sofer Stam) > P3 (ORPAZ-STYLE) > P4 (Rav Arush) > P5 (Examen civique)
    const prioRank = { 'P1': 1, 'P1-Bis': 2, 'P2': 3, 'P3': 4, 'P4': 5, 'P5': 6 };
    openTasks.sort((a, b) => (prioRank[a.priority] || 9) - (prioRank[b.priority] || 9));

    const slots = [];

    // 1. Fixed schedule (07:00 to 23:59)
    for (const f of SettingsManager.data.fixedSchedule) {
      slots.push({
        start: f.start,
        end: f.end,
        title: f.label,
        category: f.category,
        type: 'fixed',
        protected: true
      });
    }

    // 2. Custom events on this date (with optional travel buffer)
    for (const ev of events) {
      const travelMin = Number(ev.travelMin || 0);
      if (travelMin > 0) {
        const tStart = UI.timeToMin(ev.start) - travelMin;
        if (tStart >= 420) {
          slots.push({
            start: UI.minToTime(tStart),
            end: ev.start,
            title: `Trajet : ${ev.title}`,
            category: 'Déplacement',
            type: 'travel',
            protected: true
          });
        }
      }
      slots.push({
        start: ev.start,
        end: ev.end,
        title: ev.title,
        category: ev.category || 'Travail',
        type: 'event',
        protected: true
      });
    }

    if (unavail.blocked) {
      slots.push({
        start: '13:00',
        end: '18:30',
        title: unavail.isSaturday ? 'Shabbat — Repos & indisponibilité travail' : `Indisponibilité : ${unavail.reasons.map(r => r.label).join(', ')}`,
        category: 'Récupération',
        type: 'shabbat',
        protected: true
      });
      slots.sort((a, b) => UI.timeToMin(a.start) - UI.timeToMin(b.start));
      return { dateStr, unavail, slots, gaps: [], energy };
    }

    // 3. Afternoon & Evening indicative structure (13:00–18:30 and 20:30–23:15, never after 23:15)
    const dayIndex = Math.floor(new Date(dateStr + 'T12:00:00').getTime() / 86400000);
    const rotList = SettingsManager.data.eveningRotation || ['Code de la route', 'Sofer Stam', 'Examen civique'];
    const eveningProg = rotList[Math.abs(dayIndex) % rotList.length];
    const isSportDay = [1, 3, 5].includes(new Date(dateStr + 'T12:00:00').getDay()); // Lun, Mer, Ven

    const pickTask = (pred, fallbackTitle, fallbackCat) => {
      const idx = openTasks.findIndex(pred);
      if (idx >= 0) {
        const t = openTasks.splice(idx, 1)[0];
        return { title: `${t.title} (${t.priority})`, category: t.category || fallbackCat, taskId: t.id };
      }
      return { title: fallbackTitle, category: fallbackCat, taskId: null };
    };

    const bts1 = pickTask(t => t.priority === 'P1', 'BTS Opticien-Lunetier — Travail approfondi', 'Études');
    const bts2 = pickTask(t => t.priority === 'P1', 'BTS Opticien-Lunetier — Exercices & révisions', 'Études');
    const orpaz1 = pickTask(t => t.priority === 'P3', 'ORPAZ-STYLE — Action opérationnelle & fiche/catalogue', 'Entreprise');
    const nightSecondary = pickTask(t => ['P1-Bis', 'P2', 'P3', 'P5'].includes(t.priority), `${eveningProg} — Session ciblée`, 'Études');

    const suggestedBlocks = [
      { start: '13:00', end: '13:45', title: 'Déjeuner et récupération', category: 'Repas', type: 'planned' },
      {
        start: '13:45', end: '15:15',
        title: energy === 'Faible' ? 'BTS — Révision légère & relecture fiches' : bts1.title,
        category: 'Études', type: 'planned', taskId: bts1.taskId
      },
      { start: '15:15', end: '15:30', title: 'Pause active & hydratation', category: 'Pause', type: 'planned' },
      {
        start: '15:30', end: '16:30',
        title: energy === 'Faible' ? 'BTS — Classement & points faibles légers' : bts2.title,
        category: 'Études', type: 'planned', taskId: bts2.taskId
      },
      {
        start: '16:30', end: '17:15',
        title: energy === 'Faible' ? 'ORPAZ-STYLE — Veille & préparation légère' : orpaz1.title,
        category: 'Entreprise', type: 'planned', taskId: orpaz1.taskId
      },
      {
        start: '17:15', end: '18:00',
        title: isSportDay ? 'Sport (séance programmée) & retour au calme' : 'Marche active, mobilité & récupération',
        category: isSportDay ? 'Sport' : 'Récupération', type: 'planned'
      },
      { start: '18:00', end: '18:30', title: 'Douche, hygiène, changement & transition', category: 'Douche', type: 'planned' },
      // Evening after 18:30–20:30 Torah & Arvit
      { start: '20:30', end: '20:50', title: 'Transition et dîner', category: 'Repas', type: 'planned' },
      { start: '20:50', end: '21:35', title: 'BTS — Révisions ciblées ou annales', category: 'Études', type: 'planned' },
      { start: '21:35', end: '22:15', title: `Rotation soir : ${eveningProg}`, category: 'Études', type: 'planned' },
      { start: '22:15', end: '22:45', title: nightSecondary.title, category: nightSecondary.category, type: 'planned', taskId: nightSecondary.taskId },
      { start: '22:45', end: '23:15', title: 'Lecture du Rav Arush, bilan quotidien & organisation du lendemain', category: 'Lecture', type: 'planned' }
    ];

    // Add non-overlapping suggested blocks (fixed & events always win)
    for (const blk of suggestedBlocks) {
      if (UI.timeToMin(blk.end) > UI.timeToMin('23:15')) continue;
      const overlaps = slots.some(s =>
        UI.timeToMin(blk.start) < UI.timeToMin(s.end) && UI.timeToMin(blk.end) > UI.timeToMin(s.start)
      );
      if (!overlaps) slots.push(blk);
    }

    slots.sort((a, b) => UI.timeToMin(a.start) - UI.timeToMin(b.start));

    // Detect unexplained waking gaps between 07:00 and 23:15
    const gaps = [];
    let cursor = UI.timeToMin('07:00');
    const dayEnd = UI.timeToMin('23:15');
    for (const s of slots) {
      const sStart = UI.timeToMin(s.start);
      const sEnd = UI.timeToMin(s.end);
      if (sStart > cursor && cursor < dayEnd) {
        const gEnd = Math.min(sStart, dayEnd);
        const dur = gEnd - cursor;
        if (dur >= 10) {
          gaps.push({
            start: UI.minToTime(cursor),
            end: UI.minToTime(gEnd),
            durationMin: dur,
            suggestion: this.suggestForGap(dur, energy)
          });
        }
      }
      cursor = Math.max(cursor, sEnd);
    }
    if (cursor < dayEnd && (dayEnd - cursor) >= 10) {
      gaps.push({
        start: UI.minToTime(cursor),
        end: '23:15',
        durationMin: dayEnd - cursor,
        suggestion: this.suggestForGap(dayEnd - cursor, energy)
      });
    }

    return { dateStr, unavail, slots, gaps, energy };
  },

  suggestForGap(min, energy) {
    if (min <= 20) return energy === 'Faible' ? 'Récupération / hydratation' : 'Pause active ou révision express';
    if (energy === 'Élevé') return 'BTS (Optique / Analyse de la vision / Annales)';
    if (energy === 'Moyen') return 'ORPAZ-STYLE (action concrète) ou Rapport de stage';
    return 'Lecture Rav Arush, fiches légères ou organisation du lendemain';
  }
};

/* ============================================================================
   7. TaskManager & CalendarManager
   ============================================================================ */
const TaskManager = {
  async addTask(payload) {
    const task = {
      id: UI.uid('task'),
      title: payload.title.trim(),
      description: (payload.description || '').trim(),
      priority: payload.priority || 'P1',
      category: payload.category || 'Études',
      program: payload.program || 'BTS Opticien-Lunetier',
      project: payload.project || '',
      createdAt: UI.todayStr(),
      dueDate: payload.dueDate || UI.todayStr(),
      estMin: Number(payload.estMin || 30),
      actualMin: 0,
      status: payload.status || 'À faire',
      subtasks: payload.subtasks || [],
      notes: payload.notes || '',
      history: [{ date: new Date().toISOString(), action: 'Création' }],
      isDemo: false
    };
    await DatabaseManager.put('tasks', task);
    UI.toast('Tâche ajoutée', 'success');
    NavigationManager.render();
  },
  async setStatus(id, status) {
    const tasks = await DatabaseManager.getAll('tasks');
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.status = status;
    t.history = t.history || [];
    t.history.push({ date: new Date().toISOString(), action: `Statut -> ${status}` });
    await DatabaseManager.put('tasks', t);
    UI.toast(`Tâche marquée : ${status}`);
    NavigationManager.render();
  },
  async postponeTask(id) {
    const tasks = await DatabaseManager.getAll('tasks');
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    const d = new Date((t.dueDate || UI.todayStr()) + 'T12:00:00');
    d.setDate(d.getDate() + 1);
    t.dueDate = d.toISOString().slice(0, 10);
    t.status = 'Reporté';
    t.history = t.history || [];
    t.history.push({ date: new Date().toISOString(), action: `Reportée au ${t.dueDate}` });
    await DatabaseManager.put('tasks', t);
    UI.toast(`Tâche reportée au ${t.dueDate}`);
    NavigationManager.render();
  },
  async deleteTask(id) {
    UI.confirm('Supprimer la tâche', 'Confirmez-vous la suppression définitive de cette tâche ?', async () => {
      await DatabaseManager.remove('tasks', id);
      UI.toast('Tâche supprimée');
      NavigationManager.render();
    });
  }
};

/* ============================================================================
   9. BackupManager (Export/Import JSON, Validate, Dedup, Preview, Auto, History)
   ============================================================================ */
const BackupManager = {
  async exportJSON(selectedStores = null) {
    const targetStores = selectedStores && selectedStores.length ? selectedStores : STORES;
    const payload = {
      app: 'LIFE-OS',
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      settings: SettingsManager.data,
      stores: {}
    };
    for (const s of targetStores) {
      payload.stores[s] = await DatabaseManager.getAll(s);
    }
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `LIFE-OS-backup-${UI.todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    UI.toast('Export JSON téléchargé', 'success');
  },

  async createSnapshot(label = 'Sauvegarde manuelle', isAuto = false) {
    const snapData = {};
    let totalRecords = 0;
    for (const s of STORES) {
      const rows = await DatabaseManager.getAll(s);
      snapData[s] = rows;
      totalRecords += rows.length;
    }
    const snap = {
      id: UI.uid('bak'),
      createdAt: new Date().toISOString(),
      label,
      isAuto,
      schemaVersion: SCHEMA_VERSION,
      totalRecords,
      payload: snapData
    };
    await DatabaseManager.put('backups', snap);
    if (!isAuto) UI.toast(`Sauvegarde enregistrée (${totalRecords} éléments)`, 'success');
    return snap;
  },

  async quickManualBackup() {
    await this.createSnapshot('Sauvegarde rapide', false);
    if (NavigationManager.current === 'Sauvegardes') NavigationManager.render();
  },

  validateImportData(rawObj) {
    const errors = [];
    if (!rawObj || typeof rawObj !== 'object') errors.push('Format JSON invalide.');
    if (rawObj.app && rawObj.app !== 'LIFE-OS') errors.push('Fichier non reconnu comme sauvegarde LIFE-OS.');
    if (!rawObj.stores || typeof rawObj.stores !== 'object') errors.push('Section "stores" manquante.');
    return errors;
  },

  async previewImportFile(file) {
    if (!file) return;
    const text = await file.text();
    let parsed;
    try { parsed = JSON.parse(text); } catch (e) {
      UI.toast('Impossible de lire le fichier JSON.', 'danger');
      return;
    }
    const errors = this.validateImportData(parsed);
    if (errors.length) {
      UI.toast(`Validation échouée : ${errors.join(' ')}`, 'danger');
      return;
    }

    let summaryRows = '';
    let duplicateCount = 0;
    let newCount = 0;
    for (const s of STORES) {
      const incoming = Array.isArray(parsed.stores[s]) ? parsed.stores[s] : [];
      if (!incoming.length) continue;
      const existing = await DatabaseManager.getAll(s);
      const existingIds = new Set(existing.map(x => x.id));
      const dups = incoming.filter(x => existingIds.has(x.id)).length;
      const news = incoming.length - dups;
      duplicateCount += dups;
      newCount += news;
      summaryRows += `<tr><td>${esc(s)}</td><td>${incoming.length}</td><td>${news}</td><td>${dups}</td></tr>`;
    }

    window._pendingImportPayload = parsed;
    UI.openModal(`
      <h3 style="font-size:1.05rem;font-weight:700;margin-bottom:8px;">Prévisualisation avant importation</h3>
      <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:10px;">
        Version schéma : <strong>v${esc(parsed.schemaVersion || 1)}</strong> • Nouveaux : <strong>${newCount}</strong> • Doublons détectés : <strong>${duplicateCount}</strong>
      </p>
      <div class="table-wrap" style="max-height:220px;overflow-y:auto;">
        <table><thead><tr><th>Module</th><th>Total</th><th>Nouveaux</th><th>Doublons</th></tr></thead><tbody>${summaryRows || '<tr><td colspan="4">Aucun enregistrement</td></tr>'}</tbody></table>
      </div>
      <div class="field" style="margin-top:12px;">
        <label>Gestion des doublons</label>
        <select id="importDedupMode">
          <option value="skip">Ignorer les doublons existants (conserver l’existant)</option>
          <option value="overwrite">Mettre à jour / écraser les doublons par ID</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
        <button class="btn" onclick="UI.closeModal()">Annuler</button>
        <button class="btn btn-primary" onclick="BackupManager.applyImport()">Confirmer et importer</button>
      </div>
    `);
  },

  async applyImport() {
    const parsed = window._pendingImportPayload;
    if (!parsed) return;
    const mode = document.getElementById('importDedupMode').value;
    await this.createSnapshot('Sauvegarde automatique avant import', true);

    for (const s of STORES) {
      const incoming = Array.isArray(parsed.stores[s]) ? parsed.stores[s] : [];
      if (!incoming.length) continue;
      const existing = await DatabaseManager.getAll(s);
      const existingIds = new Set(existing.map(x => x.id));
      for (const item of incoming) {
        if (!item || !item.id) continue;
        if (existingIds.has(item.id) && mode === 'skip') continue;
        await DatabaseManager.put(s, item);
      }
    }
    if (parsed.settings) {
      SettingsManager.data = { ...SettingsManager.data, ...parsed.settings };
      SettingsManager.save();
    }
    window._pendingImportPayload = null;
    UI.closeModal();
    UI.toast('Importation terminée avec succès', 'success');
    NavigationManager.render();
  },

  async restoreSnapshot(id) {
    UI.confirm('Restaurer une sauvegarde', 'Cette opération va remplacer les données actuelles par celles de la sauvegarde sélectionnée. Continuer ?', async () => {
      const snaps = await DatabaseManager.getAll('backups');
      const snap = snaps.find(x => x.id === id);
      if (!snap || !snap.payload) return;
      for (const s of STORES) {
        if (s === 'backups') continue;
        await DatabaseManager.clearStore(s);
        const rows = Array.isArray(snap.payload[s]) ? snap.payload[s] : [];
        for (const r of rows) await DatabaseManager.put(s, r);
      }
      UI.toast('Sauvegarde restaurée', 'success');
      NavigationManager.render();
    });
  }
};

const NavigationManager = {
  current: 'Dashboard',
  searchQuery: '',
  init() {
    const navEl = document.getElementById('sidebarNav');
    let html = '';
    for (const sec of NAV_SECTIONS) {
      html += `<div class="nav-group-label">${esc(sec.label)}</div>`;
      for (const item of sec.items) {
        html += `<button class="nav-item" data-nav="${esc(item)}" onclick="NavigationManager.go('${esc(item)}')"><span class="nav-dot"></span><span>${esc(item)}</span></button>`;
      }
    }
    navEl.innerHTML = html;
  },
  go(page) {
    this.current = page;
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.nav === page);
    });
    document.getElementById('pageTitle').textContent = page;
    this.closeMobileMenu();
    this.render();
  },
  toggleMobileMenu() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  },
  closeMobileMenu() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  },
  handleGlobalSearch(q) {
    this.searchQuery = q.trim().toLowerCase();
    if (this.searchQuery.length >= 2) {
      this.renderSearchResults();
    } else {
      this.render();
    }
  },
  async renderSearchResults() {
    const q = this.searchQuery;
    const [tasks, docs, pCrm, oCrm, projects] = await Promise.all([
      DatabaseManager.getAll('tasks'),
      DatabaseManager.getAll('documents'),
      DatabaseManager.getAll('personalCrm'),
      DatabaseManager.getAll('orpazCrm'),
      DatabaseManager.getAll('projects')
    ]);
    const match = (obj) => JSON.stringify(obj).toLowerCase().includes(q);
    const tHits = tasks.filter(match);
    const dHits = docs.filter(match);
    const pHits = pCrm.filter(match);
    const oHits = oCrm.filter(match);
    const prHits = projects.filter(match);

    document.getElementById('appContent').innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">Résultats de recherche pour « ${esc(q)} »</div>
          <button class="btn btn-sm" onclick="document.getElementById('globalSearchInput').value='';NavigationManager.handleGlobalSearch('');">Effacer</button>
        </div>
        <div class="grid grid-2">
          <div><h4>Tâches (${tHits.length})</h4>${tHits.map(x => `<div class="kanban-item"><strong>${esc(x.title)}</strong> — <span class="badge">${esc(x.status)}</span></div>`).join('') || '<p class="card-sub">Aucune</p>'}</div>
          <div><h4>Documents & Notes (${dHits.length})</h4>${dHits.map(x => `<div class="kanban-item"><strong>${esc(x.title)}</strong> — <span class="badge">${esc(x.folder)}</span></div>`).join('') || '<p class="card-sub">Aucune</p>'}</div>
          <div><h4>CRM Personnel (${pHits.length})</h4>${pHits.map(x => `<div class="kanban-item"><strong>${esc(x.name)}</strong> — ${esc(x.role)}</div>`).join('') || '<p class="card-sub">Aucune</p>'}</div>
          <div><h4>CRM ORPAZ-STYLE (${oHits.length})</h4>${oHits.map(x => `<div class="kanban-item"><strong>${esc(x.name)}</strong> — ${esc(x.stage)}</div>`).join('') || '<p class="card-sub">Aucune</p>'}</div>
          <div><h4>Projets (${prHits.length})</h4>${prHits.map(x => `<div class="kanban-item"><strong>${esc(x.name)}</strong> — ${esc(x.status)}</div>`).join('') || '<p class="card-sub">Aucune</p>'}</div>
        </div>
      </div>
    `;
  },

  async render() {
    if (this.searchQuery.length >= 2) {
      return this.renderSearchResults();
    }
    const content = document.getElementById('appContent');
    switch (this.current) {
      case 'Dashboard': content.innerHTML = await Views.dashboard(); break;
      case 'Planning': content.innerHTML = await Views.planning(); break;
      case 'Calendrier': content.innerHTML = await Views.calendar(); break;
      case 'Tâches': content.innerHTML = await Views.tasks(); break;
      case 'Programmes': content.innerHTML = await Views.programs(); break;
      case 'BTS Opticien-Lunetier': content.innerHTML = await Views.bts(); break;
      case 'Rapport de stage': content.innerHTML = await Views.internship(); break;
      case 'Code de la route': content.innerHTML = await Views.codeRoute(); break;
      case 'Sofer Stam': content.innerHTML = await Views.soferStam(); break;
      case 'Examen civique': content.innerHTML = await Views.civicExam(); break;
      case 'Livre du Rav Arush': content.innerHTML = await Views.ravArush(); break;
      case 'ORPAZ-STYLE': content.innerHTML = await Views.orpazStyle(); break;
      case 'CRM personnel': content.innerHTML = await Views.personalCrm(); break;
      case 'CRM professionnel ORPAZ': content.innerHTML = await Views.orpazCrm(); break;
      case 'Projets': content.innerHTML = await Views.projects(); break;
      case 'Documents et notes': content.innerHTML = await Views.documents(); break;
      case 'Sport': content.innerHTML = await Views.sport(); break;
      case 'Habitudes': content.innerHTML = await Views.habits(); break;
      case 'Focus et concentration': content.innerHTML = await Views.focus(); break;
      case 'Objectifs': content.innerHTML = await Views.objectives(); break;
      case 'Minuteur': content.innerHTML = await Views.timerView(); break;
      case 'Statistiques': content.innerHTML = await Views.statistics(); break;
      case 'Paramètres': content.innerHTML = await Views.settings(); break;
      case 'Sauvegardes': content.innerHTML = await Views.backups(); break;
      default: content.innerHTML = await Views.dashboard();
    }
    if (this.current === 'Dashboard') {
      Views.startClock();
    }
  }
};

const Views = {
  clockInterval: null,
  startClock() {
    if (this.clockInterval) clearInterval(this.clockInterval);
    const tick = () => {
      const el = document.getElementById('liveClockBox');
      if (!el) return;
      const now = new Date();
      el.textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + ' • ' + now.toLocaleTimeString('fr-FR');
    };
    tick();
    this.clockInterval = setInterval(tick, 1000);
  },

  filterDemo(rows) {
    if (SettingsManager.data.showDemoData) return rows;
    return rows.filter(r => !r.isDemo);
  },

  async dashboard() {
    const today = UI.todayStr();
    const yesterdayDate = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    const plan = await PlanningEngine.buildDayPlan(today);
    const tasks = this.filterDemo(await DatabaseManager.getAll('tasks'));
    const logs = await DatabaseManager.getAll('timeLogs');
    const studyItems = this.filterDemo(await DatabaseManager.getAll('studyItems'));
    const habits = this.filterDemo(await DatabaseManager.getAll('habits'));
    const focusSessions = await DatabaseManager.getAll('focusSessions');
    const events = await DatabaseManager.getAll('events');

    const todayLogs = logs.filter(l => l.date === today);
    const yesterdayLogs = logs.filter(l => l.date === yesterdayDate);
    const sumSec = (arr, pred) => arr.filter(pred).reduce((a, b) => a + (b.durationSec || 0), 0);

    const btsSec = sumSec(todayLogs, l => l.category.includes('BTS'));
    const orpazSec = sumSec(todayLogs, l => l.category.includes('ORPAZ'));
    const sportSec = sumSec(todayLogs, l => l.category === 'Sport');
    const focusSec = focusSessions.filter(f => f.date === today).reduce((a, b) => a + (b.actualMin || 0) * 60, 0);
    const yestSec = sumSec(yesterdayLogs, () => true);

    const priorityTasks = tasks.filter(t => t.status !== 'Terminé' && ['P1', 'P1-Bis', 'P2', 'P3'].includes(t.priority));
    const overdueTasks = tasks.filter(t => !['Terminé', 'Annulé'].includes(t.status) && t.dueDate && t.dueDate < today);
    const completedToday = tasks.filter(t => t.status === 'Terminé' && t.dueDate === today);

    const items = this.filterDemo(await DatabaseManager.getAll('studyItems'));
    let weightedSum = 0, coeffSum = 0;
    items.forEach(it => {

        const avg = it.grades.reduce((a, b) => a + Number(b), 0) / it.grades.length;
        weightedSum += avg * Number(it.coeff || 1);
        coeffSum += Number(it.coeff || 1);
      }
    });
    const generalAvg = coeffSum > 0 ? (weightedSum / coeffSum).toFixed(2) : '—';

    return `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-header">

  async statistics() {
    const logs = await DatabaseManager.getAll('timeLogs');
    const tasks = this.filterDemo(await DatabaseManager.getAll('tasks'));
    const byCat = {};
    for (const l of logs) {
      byCat[l.category] = (byCat[l.category] || 0) + (l.durationSec || 0);
    }
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const maxSec = Math.max(1, ...entries.map(e => e[1]));
    const doneTasks = tasks.filter(t => t.status === 'Terminé').length;
    const postponedTasks = tasks.filter(t => t.status === 'Reporté').length;

    // SVG horizontal bar chart from real measured timeLogs only
    const svgRows = entries.length ? entries.map(([cat, sec], idx) => {
      const y = idx * 34 + 10;
      const w = Math.max(4, Math.round((sec / maxSec) * 320));
      return `
        <text x="0" y="${y + 14}" fill="currentColor" font-size="12">${esc(cat.slice(0, 22))}</text>
        <rect x="170" y="${y}" width="${w}" height="20" rx="5" fill="#38bdf8" />
        <text x="${178 + w}" y="${y + 14}" fill="currentColor" font-size="11">${UI.formatHoursFromSec(sec)}</text>
      `;
    }).join('') : `<text x="0" y="24" fill="currentColor" font-size="12">Aucune donnée de temps mesurée pour le moment.</text>`;

    return `
      <div class="grid grid-3" style="margin-bottom:16px;">
        <div class="card"><div class="kpi-label">Tâches terminées</div><div class="kpi-val">${doneTasks}</div></div>
        <div class="card"><div class="kpi-label">Tâches reportées</div><div class="kpi-val">${postponedTasks}</div></div>
        <div class="card"><div class="kpi-label">Entrées de temps réelles</div><div class="kpi-val">${logs.length}</div></div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:10px;">Répartition du temps réellement mesuré (Graphique SVG local)</div>
        <div style="overflow-x:auto;">
          <svg width="560" height="${Math.max(60, entries.length * 34 + 16)}" style="color:var(--text-main);">
            ${svgRows}
          </svg>
        </div>
      </div>
    `;
  },
