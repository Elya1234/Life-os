<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06b6d4" />
  <meta name="description" content="LIFE-OS — Système d'exploitation personnel offline-first : tâches, planning intelligent, mode focus, BTS OL, ORPAZ-STYLE, Torah, vie personnelle, CRM hybride et pilotage." />
  <title>LIFE-OS — Système d'Exploitation Personnel</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070d1b'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%2306b6d4' stroke-width='4.5'/%3E%3Cpath d='M25 32 L30 37 L40 26' fill='none' stroke='%2322d3ee' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar" aria-label="Navigation principale LIFE-OS">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="24" height="24" fill="none">
              <circle cx="16" cy="16" r="12" stroke="currentColor" stroke-width="2.4" />
              <path d="M11.5 16.5L14.5 19.5L21 12.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">LIFE-OS</span>
            <span class="brand-sub">Personal OS · Offline</span>
          </div>
        </div>
        <button id="btn-close-sidebar" class="icon-btn mobile-only" type="button" aria-label="Fermer le menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <nav class="nav-list" role="navigation">
        <button class="nav-item active" data-section="dashboard" type="button">
          <span class="nav-icon" data-icon="dashboard"></span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" data-section="tasks" type="button">
          <span class="nav-icon" data-icon="tasks"></span>
          <span class="nav-label">Tâches</span>
          <span class="nav-badge" id="badge-tasks-count">0</span>
        </button>
        <button class="nav-item" data-section="planning" type="button">
          <span class="nav-icon" data-icon="planning"></span>
          <span class="nav-label">Planning</span>
        </button>
        <button class="nav-item" data-section="focus" type="button">
          <span class="nav-icon" data-icon="focus"></span>
          <span class="nav-label">Mode Focus</span>
        </button>
        <button class="nav-item" data-section="studies" type="button">
          <span class="nav-icon" data-icon="studies"></span>
          <span class="nav-label">Études</span>
        </button>
        <button class="nav-item" data-section="business" type="button">
          <span class="nav-icon" data-icon="business"></span>
          <span class="nav-label">Business</span>
        </button>
        <button class="nav-item" data-section="torah" type="button">
          <span class="nav-icon" data-icon="torah"></span>
          <span class="nav-label">Torah</span>
        </button>
        <button class="nav-item" data-section="personal" type="button">
          <span class="nav-icon" data-icon="personal"></span>
          <span class="nav-label">Vie personnelle</span>
        </button>
        <button class="nav-item" data-section="crm" type="button">
          <span class="nav-icon" data-icon="crm"></span>
          <span class="nav-label">CRM</span>
        </button>
        <button class="nav-item" data-section="habits" type="button">
          <span class="nav-icon" data-icon="habits"></span>
          <span class="nav-label">Habitudes</span>
        </button>
        <button class="nav-item" data-section="goals" type="button">
          <span class="nav-icon" data-icon="goals"></span>
          <span class="nav-label">Objectifs</span>
        </button>
        <button class="nav-item" data-section="analytics" type="button">
          <span class="nav-icon" data-icon="analytics"></span>
          <span class="nav-label">Pilotage</span>
        </button>
        <button class="nav-item" data-section="settings" type="button">
          <span class="nav-icon" data-icon="settings"></span>
          <span class="nav-label">Paramètres</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="theme-switcher" role="group" aria-label="Sélection du thème">
          <button type="button" class="theme-btn" data-theme-choice="light" title="Mode clair" aria-label="Mode clair">Clair</button>
          <button type="button" class="theme-btn" data-theme-choice="dark" title="Mode sombre" aria-label="Mode sombre">Sombre</button>
          <button type="button" class="theme-btn" data-theme-choice="auto" title="Mode automatique" aria-label="Mode automatique">Auto</button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-open-sidebar" class="icon-btn mobile-only" type="button" aria-label="Ouvrir le menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" />
            </svg>
          </button>
          <div class="page-title-wrap">
            <h1 id="topbar-title" class="page-title">Dashboard</h1>
            <span id="topbar-date" class="topbar-date"></span>
          </div>
        </div>

        <div class="topbar-center">
          <div class="global-search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <path d="M21 21l-4.35-4.35" stroke-linecap="round" />
            </svg>
            <input
              id="global-search-input"
              type="search"
              placeholder="Rechercher tâche, projet, événement, contact, note, échéance..."
              aria-label="Recherche globale dans LIFE-OS"
              autocomplete="off"
            />
            <button id="btn-clear-search" class="clear-search-btn hidden" type="button" aria-label="Effacer la recherche">×</button>
          </div>
          <div id="global-search-results" class="search-dropdown hidden" role="region" aria-label="Résultats de recherche globale"></div>
        </div>

        <div class="topbar-right">
          <div id="network-status-pill" class="status-pill" title="État de connexion réseau et stockage local">
            <span class="status-dot"></span>
            <span id="network-status-text">Local</span>
          </div>
          <button id="btn-topbar-new-task" class="btn btn-primary" type="button">
            <span>+ Nouvelle tâche</span>
          </button>
        </div>
      </header>

      <!-- Content Area -->
      <main id="main-content" class="main-content" tabindex="-1">
        <!-- Sections dynamically rendered & managed by app.js -->
        <section id="section-dashboard" class="view-section active" aria-labelledby="topbar-title"></section>
        <section id="section-tasks" class="view-section" aria-label="Tâches"></section>
        <section id="section-planning" class="view-section" aria-label="Planning"></section>
        <section id="section-focus" class="view-section" aria-label="Mode Focus"></section>
        <section id="section-studies" class="view-section" aria-label="Études BTS OL"></section>
        <section id="section-business" class="view-section" aria-label="Business ORPAZ-STYLE"></section>
        <section id="section-torah" class="view-section" aria-label="Torah"></section>
        <section id="section-personal" class="view-section" aria-label="Vie personnelle"></section>
        <section id="section-crm" class="view-section" aria-label="CRM Hybride"></section>
        <section id="section-habits" class="view-section" aria-label="Habitudes"></section>
        <section id="section-goals" class="view-section" aria-label="Objectifs"></section>
        <section id="section-analytics" class="view-section" aria-label="Pilotage et Statistiques"></section>
        <section id="section-settings" class="view-section" aria-label="Paramètres"></section>
      </main>

      <!-- Mobile Bottom Navigation -->
      <nav class="mobile-bottom-nav mobile-only" aria-label="Navigation rapide mobile">
        <button class="bottom-nav-btn active" data-section="dashboard" type="button">
          <span class="bnav-icon" data-icon="dashboard"></span>
          <span>Accueil</span>
        </button>
        <button class="bottom-nav-btn" data-section="tasks" type="button">
          <span class="bnav-icon" data-icon="tasks"></span>
          <span>Tâches</span>
        </button>
        <button class="bottom-nav-btn" data-section="planning" type="button">
          <span class="bnav-icon" data-icon="planning"></span>
          <span>Planning</span>
        </button>
        <button class="bottom-nav-btn" data-section="focus" type="button">
          <span class="bnav-icon" data-icon="focus"></span>
          <span>Focus</span>
        </button>
        <button class="bottom-nav-btn" id="btn-mobile-more" type="button">
          <span class="bnav-icon" data-icon="more"></span>
          <span>Plus</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Action</h2>
        <button id="btn-close-modal" class="icon-btn" type="button" aria-label="Fermer la fenêtre">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="./app.js" defer></script>
</body>
</html>
